apiVersion: batch/v1
kind: Job
metadata:
  name: pgvector-create-vector-extension
  labels:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/instance: pgvector
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgvector
        app.kubernetes.io/instance: pgvector
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-vector-extension
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgvector
                  key: password
            - name: PGUSER
              value: "pguser"
            - name: PGDATABASE
              value: "pgvector"
          command: ["sh", "-c"]
          args:
            - >-
              psql -v ON_ERROR_STOP=1
              -h pgvector
              -p 5432
              -U "$PGUSER"
              -d "$PGDATABASE"
              -c "CREATE EXTENSION IF NOT EXISTS vector;"
