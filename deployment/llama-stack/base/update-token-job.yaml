---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-updater
  namespace: llama-stack
  labels:
    app: token-updater
# Note: imagePullSecrets not needed when using ImageStream in the same namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-updater
  namespace: llama-stack
  labels:
    app: token-updater
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: token-updater
  namespace: llama-stack
  labels:
    app: token-updater
subjects:
- kind: ServiceAccount
  name: token-updater
  namespace: llama-stack
roleRef:
  kind: Role
  name: token-updater
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: update-stellar-api-token
  namespace: llama-stack
  labels:
    app: token-updater
spec:
  schedule: "*/25 * * * *"  # Run every minute
  successfulJobsHistoryLimit: 3  # Keep 3 successful job history
  failedJobsHistoryLimit: 1  # Keep 1 failed job history
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300  # Clean up job after 5 minutes
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: token-updater
          containers:
          - name: token-updater
            image: ose-cli:latest  # Using ImageStream (no pull secret needed)
            imagePullPolicy: Always
            env:
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-api-secret
                  key: client-id
                  optional: true
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vault-api-secret
                  key: client-secret
                  optional: true
            - name: SCOPE
              valueFrom:
                secretKeyRef:
                  name: vault-api-secret
                  key: scope
                  optional: true
            - name: COIN_URL
              valueFrom:
                secretKeyRef:
                  name: vault-api-secret
                  key: vault-url
                  optional: true
            command:
              - /bin/bash
              - -c
              - |
                set -e
                
                echo "Starting token generation..."
                
                # Validate required environment variables
                if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$SCOPE" ] || [ -z "$COIN_URL" ]; then
                  echo "Error: Missing required environment variables"
                  echo "Required: CLIENT_ID, CLIENT_SECRET, SCOPE, COIN_URL"
                  exit 1
                fi
                
                # Make the curl request to get access token
                echo "Requesting access token from $COIN_URL..."
                RESPONSE=$(curl -k -s -d "client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&grant_type=client_credentials&scope=${SCOPE}" "${COIN_URL}")
                
                # Check if curl was successful
                if [ $? -ne 0 ]; then
                  echo "Error: Failed to make request to token endpoint"
                  exit 1
                fi
                
                # Extract access_token from JSON response using jq or grep/sed
                if command -v jq &> /dev/null; then
                  ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
                else
                  # Fallback to grep/sed if jq is not available
                  ACCESS_TOKEN=$(echo "$RESPONSE" | grep -o '"access_token":"[^"]*' | sed 's/"access_token":"//')
                fi
                
                # Validate that we got a token
                if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
                  echo "Error: Failed to extract access_token from response"
                  echo "Response: $RESPONSE"
                  exit 1
                fi
                
                echo "Successfully retrieved access token (length: ${#ACCESS_TOKEN})"
                
                # Base64 encode the access token
                ENCODED_TOKEN=$(echo -n "$ACCESS_TOKEN" | base64 | tr -d '\n')
                
                # Check if secret exists, create if it doesn't
                if ! oc get secret llama-stack-api -n llama-stack &>/dev/null; then
                  echo "Secret llama-stack-api does not exist, creating it..."
                  oc create secret generic llama-stack-api \
                    --from-literal=stellarapikey="$ACCESS_TOKEN" \
                    -n llama-stack
                  echo "Secret llama-stack-api created successfully"
                else
                  echo "Updating existing secret llama-stack-api..."
                  # Update the secret using oc patch with base64 encoded value
                  oc patch secret llama-stack-api -n llama-stack \
                    --type='json' \
                    -p="[{\"op\": \"replace\", \"path\": \"/data/stellarapikey\", \"value\": \"${ENCODED_TOKEN}\"}]"
                  echo "Secret llama-stack-api updated successfully"
                fi
                
                echo "Token update completed successfully!"
                
                # Restart llama-stack pod to pick up new token
                # This causes a brief downtime (~10-30 seconds) but ensures
                # the new token is picked up immediately
                echo ""
                echo "Finding llama-stack pod to restart..."
                
                # Try multiple selectors to find the llama-stack pod
                POD_NAME=""
                
                # Try by label selector (common patterns)
                POD_NAME=$(oc get pods -n llama-stack -l app=llama-stack -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
                
                # If not found, try by name pattern
                if [ -z "$POD_NAME" ]; then
                  POD_NAME=$(oc get pods -n llama-stack -o jsonpath='{.items[?(@.metadata.name=~"llama.*")].metadata.name}' 2>/dev/null | awk '{print $1}' || echo "")
                fi
                
                # If still not found, try llamastack (no hyphen)
                if [ -z "$POD_NAME" ]; then
                  POD_NAME=$(oc get pods -n llama-stack -o jsonpath='{.items[?(@.metadata.name=~"llamastack.*")].metadata.name}' 2>/dev/null | awk '{print $1}' || echo "")
                fi
                
                # If still not found, list all pods and try to find it
                if [ -z "$POD_NAME" ]; then
                  POD_NAME=$(oc get pods -n llama-stack -o name 2>/dev/null | grep -i llama | head -1 | sed 's|pod/||' || echo "")
                fi
                
                if [ -n "$POD_NAME" ]; then
                  echo "Found llama-stack pod: $POD_NAME"
                  echo "Restarting pod to pick up new token..."
                  oc delete pod "$POD_NAME" -n llama-stack --grace-period=30 --ignore-not-found=true
                  echo "Pod restart initiated. New pod will start with updated token."
                  
                  # Wait a moment and verify pod is restarting
                  sleep 2
                  echo "Checking pod status..."
                  oc get pod "$POD_NAME" -n llama-stack 2>/dev/null || echo "Pod deleted, new pod will be created by the operator/deployment"
                else
                  echo "Warning: No llama-stack pod found to restart"
                  echo "Available pods in namespace:"
                  oc get pods -n llama-stack -o name 2>/dev/null || echo "Could not list pods"
                fi
          restartPolicy: Never
