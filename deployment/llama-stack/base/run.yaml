version: '2'
image_name: remote-vllm
server:
  port: 8321
  host: "0.0.0.0"
apis:
  - agents
  - datasetio
  - files
  - eval
  - inference
  - safety
  - scoring
  - telemetry
  - tool_runtime
  - vector_io
providers:
  inference:
    - provider_id: llama-17b
      provider_type: remote::vllm
      config:
        url: ${env.LLAMA17B_URL}
        max_tokens: 4096
        api_token: ${env.LLAMA17B_TOKEN}
        tls_verify: false
    - provider_id: sentence-transformers
      provider_type: inline::sentence-transformers
      config: {}
  vector_io:
    - provider_id: pgvector
      provider_type: remote::pgvector
      config:
        host: ${env.PGVECTOR_HOST:=localhost}
        port: ${env.PGVECTOR_PORT:=5432}
        db: ${env.PGVECTOR_DB:=pgvector}
        user: ${env.PGVECTOR_USER:=pguser}
        password: ${env.PGVECTOR_PASSWORD}
        kvstore:
          type: postgres
          host: ${env.PGVECTOR_HOST:=localhost}
          port: ${env.PGVECTOR_PORT:=5432}
          db: ${env.PGVECTOR_DB:=pgvector}
          user: ${env.PGVECTOR_USER:=pguser}
          password: ${env.PGVECTOR_PASSWORD}
  agents:
    - provider_id: meta-reference
      provider_type: inline::meta-reference
      config:
        persistence_store:
          type: sqlite
          namespace: null
          db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/rh}/agents_store.db
        responses_store:
          type: sqlite
          namespace: null
          db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/rh}/responses_store.db            
  eval:
    - provider_id: meta-reference
      provider_type: inline::meta-reference
      config:
        kvstore:
          type: sqlite
          namespace: null
          db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/rh}/meta_reference_eval.db
  files:
    - provider_id: meta-reference-files
      provider_type: inline::localfs
      config:
        metadata_store:
          db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/rh}/files_metadata.db
          type: sqlite
        storage_dir: ${env.SQLITE_STORE_DIR:~/.llama/distributions/rh}/files            
  datasetio:
    - provider_id: huggingface
      provider_type: remote::huggingface
      config:
        kvstore:
          type: sqlite
          namespace: null
          db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/rh}/huggingface_datasetio.db
    - provider_id: localfs
      provider_type: inline::localfs
      config:
        kvstore:
          type: sqlite
          namespace: null
          db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/rh}/localfs_datasetio.db
  scoring:
    - provider_id: basic
      provider_type: inline::basic
      config: {}
    - provider_id: llm-as-judge
      provider_type: inline::llm-as-judge
      config: {}
    - provider_id: braintrust
      provider_type: inline::braintrust
      config:
        openai_api_key: ${env.OPENAI_API_KEY:}
  telemetry:
    - provider_id: meta-reference
      provider_type: inline::meta-reference
      config:
        service_name: llamastack
        sinks:
          - console
          - otel_trace
          - otel_metric
        otel_exporter_otlp_endpoint: ${env.OTEL_EXPORTER_OTLP_ENDPOINT:}
        sqlite_db_path: ${env.SQLITE_DB_PATH:~/.llama/distributions/rh/trace_store.db}
  tool_runtime:
    - provider_id: brave-search
      provider_type: remote::brave-search
      config:
        api_key: ${env.BRAVE_SEARCH_API_KEY:}
        max_results: 3
    - provider_id: tavily-search
      provider_type: remote::tavily-search
      config:
        api_key: ${env.TAVILY_SEARCH_API_KEY:}
        max_results: 3
    - provider_id: rag-runtime
      provider_type: inline::rag-runtime
      config: {}
    - provider_id: model-context-protocol
      provider_type: remote::model-context-protocol
      config: {}
metadata_store:
  type: sqlite
  db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/rh}/registry.db

models:   
  - metadata: {}
    model_id: ${env.LLAMA17B_MODEL}
    provider_id: llama-17b
    model_type: llm
  - metadata:
      embedding_dimension: 768
    model_id: granite-embedding-125m
    provider_model_id: ibm-granite/granite-embedding-125m-english
    provider_id: sentence-transformers
    model_type: embedding

vector_dbs: []
datasets: []
scoring_fns: []
benchmarks: []
tool_groups:
  - toolgroup_id: builtin::websearch
    provider_id: tavily-search
  - toolgroup_id: builtin::rag
    provider_id: rag-runtime
  - toolgroup_id: mcp::openshift
    provider_id: model-context-protocol
    mcp_endpoint:
      uri: "http://ocp-mcp-server.llama-stack.svc.cluster.local:8000/mcp"
  - toolgroup_id: mcp::slack
    provider_id: model-context-protocol
    mcp_endpoint:
      uri: "http://slack-mcp-server:80/sse"
  - toolgroup_id: mcp::atlassian
    provider_id: model-context-protocol
    mcp_endpoint:
      uri: "http://atlassian-mcp-server:8080/sse"
  - toolgroup_id: mcp::snow
    provider_id: model-context-protocol
    mcp_endpoint:
      uri: "http://mcp-self-service-agent-snow.it-self-service-agent.svc.cluster.local:8000/mcp"